site_name: trigger-runner
site_description: Measure whether agent skills fire on the requests they are meant to serve.
site_url: https://yufeiminds.github.io/trigger-runner/
repo_url: https://github.com/yufeiminds/trigger-runner
repo_name: yufeiminds/trigger-runner
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Run your first trigger evaluation: tutorials/run-your-first-evaluation.md
  - Reference:
      - Overview: reference/index.md
      - trigger_runner: reference/trigger-runner.md
      - trigger_runner2: reference/second-pass-runner.md
      - Configuration: reference/configuration.md
      - Results: reference/results.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

strict: true
